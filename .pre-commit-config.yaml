# pre-commit Configuration (openGauss Server, C++ Core)
#
# Strategy: Adopt .clang-format and .clang-tidy, with line width aligned to team standards.
# First-time setup: Run bash setup-pre-commit.sh

# Exclude third-party libraries, build directories, documentation, and non-source files
exclude: '^(doc/|docs/|docs-lite/|build/|contrib/|docker/|third_party/|src/test/|.*\.min\.js$|.*\.o$|.*\.so$)'

repos:
  # 1. Basic hygiene checks
  - repo: https://gitcode.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # 只检查 cpp
      - id: trailing-whitespace
        files: \.cpp$

      # 只检查 cpp
      - id: end-of-file-fixer
        files: \.cpp$

      # 配置文件检查
      - id: check-yaml
        args:
          - --allow-multiple-documents
        files: \.cpp$

      - id: check-json
   
      - id: check-merge-conflict

     
      - id: check-added-large-files

        

      - id: detect-private-key
       

