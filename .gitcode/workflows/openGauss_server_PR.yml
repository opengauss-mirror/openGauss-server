name: openGauss_server_PR

on:
  push:
    branches:
      - master
    paths-ignore:
      - '.gitcode/**'
      - 'doc/**'
      - 'docs/**'
      - 'docs-lite/**'
  pull_request_target:
    types:
      - open
      - update
      - reopen
    branches:
      - master
      - '**'
  pull_request_comment:
    types:
      - created
    branches:
      - master
      - '**'
    comments:
      - '^\s*/retest\s*$'
  workflow_dispatch:

permissions:
  repository: read
  pr: write
  note: write

# Kubernetes runner-set（Settings → Actions → Runners → kubernetes）在原有 server_x86 /
# server_arm 标签基础上新增 cpu=16（与 ci_config runs-on 的 cpu=N 写法一致）。
# 当前 fork 已登记：arm-16 → server_arm + cpu=16；x86 需同集群再建 server_x86 + cpu=16。
# job 增加 container:（参考 ci_config PR-pipeline.yml）：步骤在指定镜像内执行；
# 测试任务在该容器里执行 /usr/local/bin/entrypoint_*.sh，并挂载 docker.sock。
# 同一 PR 再次触发（新提交、reopen、/retest）时，立刻取消还在跑的上一次门禁。
# mr_id 抢占只作用于同一个合并请求；不同 PR 仍可并行。
concurrency:
  max: 100
  exceed-action: QUEUE
  enable: true
  preemption:
    enable: true
    events: [mr_id]

env:
  pr_id: ${{ atomgit.event.pull_request.number }}
  GITCODE_REPO: openGauss/openGauss-server
  GITCODE_EVENT_NAME: ${{ atomgit.event_name }}
  GITCODE_RUN_ID: ${{ atomgit.workflow_run_id }}
  GITCODE_ACTIONS_RUN_ID: ${{ atomgit.run_id }}
  GITCODE_PR_IID: ${{ (atomgit.event_name != 'pull_request_comment' && atomgit.event_name != 'pr_comment') && (atomgit.event.pull_request.number || atomgit.event.pull_request.iid || atomgit.event.merge_request.iid || atomgit.event.merge_request.number) || '' }}
  GITCODE_TARGET_BRANCH: ${{ (atomgit.event_name != 'pull_request_comment' && atomgit.event_name != 'pr_comment') && (atomgit.base_ref || atomgit.event.pull_request.base.ref || atomgit.event.pull_request.target_branch || atomgit.event.merge_request.target_branch) || '' }}

stages:
  create_label:
    name: CreateLabel
    select: selected_by_default
    jobs:
      prepare:
        name: Mark running
        runs-on: [self-hosted, server_x86, cpu=16]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/opengauss-ci/opengauss-ci-x86:script-1.0.1
          options: --user root
        timeout-minutes: 10
        continue-on-error: true
        outputs:
          proceed: ${{ steps.publish.outputs.proceed }}
          labeled: ${{ steps.publish.outputs.labeled }}
          run_epoch: ${{ steps.state.outputs.run_epoch }}
        steps:
          - name: Createlabel
            id: state
            env:
              LABEL_JOB_TAG: prepare
              PR_LABEL_TOKEN: ${{ secrets.PR_LABEL_TOKEN }}
            run: |
              set -eu
              umask 077
              run_key="${GITCODE_RUN_ID:-}"
              case "${run_key}" in
                ''|*[!A-Za-z0-9._-]*) run_key="${ATOMGIT_RUN_ID:-}" ;;
              esac
              case "${run_key}" in
                ''|*[!A-Za-z0-9._-]*) run_key="${ATOMGIT_RUN_NUMBER:-}" ;;
              esac
              case "${run_key}" in
                ''|*[!A-Za-z0-9._-]*)
                  echo "Cannot name the label state file." >&2
                  exit 1
                  ;;
              esac
              repo="${GITCODE_REPO:-openGauss/openGauss-server}"
              server="${ATOMGIT_SERVER_URL:-}"
              if [ -z "${server}" ]; then
                server="${GITCODE_SERVER_URL:-}"
              fi
              if [ -z "${server}" ]; then
                server="https://gitcode.com"
              fi
              server="${server%/}"
              src="$(mktemp -d)"
              trap 'rm -rf "${src}"' EXIT
              timeout 300 git clone --depth=1 --branch master "${server}/${repo}.git" "${src}"
              label_script="${src}/.gitcode/scripts/gitcode_pr_labels.sh"
              bash "${label_script}" delete ci-pipeline-success
              bash "${label_script}" delete ci-pipeline-failed
              bash "${label_script}" add ci-pipeline-running

  only_doc:
    name: only_doc
    select: selected_by_default
    jobs:
      Detect_file_changes:
        name: Detect_file_changes
        continue-on-error: true
        runs-on: [self-hosted, server_x86, cpu=16]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/opengauss-ci/opengauss-ci-x86:script-1.0.1
        outputs:
          need_run_ut: ${{ steps.set-skip.outputs.need_run_ut }}
        steps:
          - name: checkout
            uses: checkout
            with:
              ref: refs/merge-requests/${{ env.pr_id }}/head
              fetch-depth: 0
              allow-unsafe-pr-checkout: true
          - name: Only_doc_commit
            id: filter
            uses: paths-changes-filter
            with:
              event-name: 'pull_request'
              base: ${{ atomgit.event.pull_request.base.ref }}
              repo: ${{ atomgit.repository }}
              number: ${{ env.pr_id }}
              token: ${{ secrets.GIT_TOKEN }}
              list-files: json
              predicate-quantifier: every
              filters: |
                changed:
                  - '**'
                non-doc:
                  - '!**/*.md'
                  - '!**/*.rst'
                  - '!**/*.log'
                  - '!**/*.png'
                  - '!**/*.jpg'
                  - '!**/*.doc'
                  - '!**/*.eddx'
                  - '!**/*.svg'
                  - '!.gitcode/**'
                  - '!**/*.yml'
                  - '!**/*.yaml'

          - name: set build skip flag
            id: set-skip
            env:
              CHANGED_FILES: ${{ steps.filter.outputs.changed_files }}
              NON_DOC: ${{ steps.filter.outputs.non-doc }}
            run: |
              echo "changed: $CHANGED_FILES"
              echo "non-doc: $NON_DOC"
              if [ "$NON_DOC" = "true" ]; then
                echo "need_run_ut=yes" >> "$ATOMGIT_OUTPUT"
              else
                echo "need_run_ut=no" >> "$ATOMGIT_OUTPUT"
              fi

  test_case:
    name: running test case
    select: selected_by_default
    jobs:
      llt_a_arm:
        name: fastcheck_A_arm
        timeout-minutes: 60
        if: ${{ jobs.Detect_file_changes.outputs.need_run_ut == 'yes' }}
        continue-on-error: true
        runs-on: [self-hosted, server_arm, cpu=16]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/opengauss-ci/opengauss-ci-arm:llt-1.0.1
          options: --user root
        outputs:
          result: ${{ steps.run_fastcheck_a_arm.outputs.result }}
        steps:
          - name: run_fastcheck_a_arm
            id: run_fastcheck_a_arm
            run: |
              PART_TYPE=A
              sh /usr/local/bin/entrypoint_llt.sh 
              if [ "$?" == "0" ]; then
                echo "result=0" >> "$ATOMGIT_OUTPUT"
              else
                echo "result=1" >> "$ATOMGIT_OUTPUT"
                exit 1
              fi

      llt_b_arm:
        name: fastcheck_B_arm
        timeout-minutes: 60
        if: ${{ jobs.Detect_file_changes.outputs.need_run_ut == 'yes' }}
        continue-on-error: true
        runs-on: [self-hosted, server_arm, cpu=16]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/opengauss-ci/opengauss-ci-arm:llt-1.0.1
          options: --user root
        outputs:
          result: ${{ steps.run_fastcheck_b_arm.outputs.result }}        
        steps:
          - name: run_fastcheck_b_arm
            id: run_fastcheck_b_arm
            run: |
              PART_TYPE=B
              sh /usr/local/bin/entrypoint_llt.sh 
              if [ "$?" == "0" ]; then
                echo "result=0" >> "$ATOMGIT_OUTPUT"
              else
                echo "result=1" >> "$ATOMGIT_OUTPUT"
                exit 1
              fi              

      llt_c_arm:
        name: fastcheck_C_arm
        timeout-minutes: 60
        if: ${{ jobs.Detect_file_changes.outputs.need_run_ut == 'yes' }}
        continue-on-error: true
        runs-on: [self-hosted, server_arm, cpu=16]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/opengauss-ci/opengauss-ci-arm:llt-1.0.1
          options: --user root
        outputs:
          result: ${{ steps.run_fastcheck_c_arm.outputs.result }}
        steps:
          - name: run_fastcheck_c_arm
            id: run_fastcheck_c_arm
            run: |
              PART_TYPE=C
              sh /usr/local/bin/entrypoint_llt.sh 
              if [ "$?" == "0" ]; then
                echo "result=0" >> "$ATOMGIT_OUTPUT"
              else
                echo "result=1" >> "$ATOMGIT_OUTPUT"
                exit 1
              fi

      llt_a_x86:
        name: fastcheck_A_x86
        timeout-minutes: 60
        if: ${{ jobs.Detect_file_changes.outputs.need_run_ut == 'yes' }}
        continue-on-error: true
        runs-on: [self-hosted, server_x86, cpu=16]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/opengauss-ci/opengauss-ci-x86:llt-1.0.1
          options: --user root
        outputs:
          result: ${{ steps.run_fastcheck_a_x86.outputs.result }}
        steps:
          - name: run_fastcheck_a_x86
            id: run_fastcheck_a_x86
            run: |
              PART_TYPE=A
              sh /usr/local/bin/entrypoint_llt.sh 
              if [ "$?" == "0" ]; then
                echo "result=0" >> "$ATOMGIT_OUTPUT"
              else
                echo "result=1" >> "$ATOMGIT_OUTPUT"
                exit 1
              fi

      llt_b_x86:
        name: fastcheck_B_x86
        timeout-minutes: 60
        if: ${{ jobs.Detect_file_changes.outputs.need_run_ut == 'yes' }}
        continue-on-error: true
        runs-on: [self-hosted, server_x86, cpu=16]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/opengauss-ci/opengauss-ci-x86:llt-1.0.1
          options: --user root
        outputs:
          result: ${{ steps.run_fastcheck_b_x86.outputs.result }}
        steps:
          - name: run_fastcheck_b_x86
            id: run_fastcheck_b_x86
            run: |
              PART_TYPE=B
              sh /usr/local/bin/entrypoint_llt.sh 
              if [ "$?" == "0" ]; then
                echo "result=0" >> "$ATOMGIT_OUTPUT"
              else
                echo "result=1" >> "$ATOMGIT_OUTPUT"
                exit 1
              fi

      llt_c_x86:
        name: fastcheck_C_x86
        timeout-minutes: 60
        if: ${{ jobs.Detect_file_changes.outputs.need_run_ut == 'yes' }}
        continue-on-error: true
        runs-on: [self-hosted, server_x86, cpu=16]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/opengauss-ci/opengauss-ci-x86:llt-1.0.1
          options: --user root
        outputs:
          result: ${{ steps.run_fastcheck_c_x86.outputs.result }}
        steps:
          - name: run_fastcheck_c_x86
            id: run_fastcheck_c_x86
            run: |
              PART_TYPE=C
              sh /usr/local/bin/entrypoint_llt.sh 
              if [ "$?" == "0" ]; then
                echo "result=0" >> "$ATOMGIT_OUTPUT"
              else
                echo "result=1" >> "$ATOMGIT_OUTPUT"
                exit 1
              fi

      om_install_x86:
        name: om_install_x86
        timeout-minutes: 60
        if: ${{ jobs.Detect_file_changes.outputs.need_run_ut == 'yes' }}
        continue-on-error: true
        runs-on: [self-hosted, server_x86, cpu=16]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/opengauss-ci/opengauss-ci-x86:ominstall-1.0.1
          options: --user root
        outputs:
          result: ${{ steps.run_fastcheck_om_install_x86.outputs.result }}
        steps:
          - name: run_fastcheck_om_install_x86
            id: run_fastcheck_om_install_x86
            run: |
              sh /usr/local/bin/entrypoint_om_install.sh
              if [ "$?" == "0" ]; then
                echo "result=0" >> "$ATOMGIT_OUTPUT"
              else
                echo "result=1" >> "$ATOMGIT_OUTPUT"
                exit 1
              fi

      om_upgrade_x86:
        name: om_upgrade_x86
        timeout-minutes: 60
        if: ${{ jobs.Detect_file_changes.outputs.need_run_ut == 'yes' }}
        continue-on-error: true
        runs-on: [self-hosted, server_x86, cpu=16]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/opengauss-ci/opengauss-ci-x86:omupgrade-1.0.1
          options: --user root
        outputs:
          result: ${{ steps.run_fastcheck_om_upgrade_x86.outputs.result }}
        steps:
          - name: run_fastcheck_om_upgrade_x86
            id: run_fastcheck_om_upgrade_x86
            run: |
              sh /usr/local/bin/entrypoint_om_upgrade.sh
              if [ "$?" == "0" ]; then
                echo "result=0" >> "$ATOMGIT_OUTPUT"
              else
                echo "result=1" >> "$ATOMGIT_OUTPUT"
                exit 1
              fi

      ss_hatest_x86:
        name: ss_hatest_x86
        timeout-minutes: 60
        if: ${{ jobs.Detect_file_changes.outputs.need_run_ut == 'yes' }}
        continue-on-error: true
        runs-on: [self-hosted, server_x86, cpu=16]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/opengauss-ci/opengauss-ci-x86:ssha-1.0.1
          options: --user root
        outputs:
          result: ${{ steps.run_fastcheck_ss_hatest_x86.outputs.result }}
        steps:
          - name: run_fastcheck_ss_hatest_x86
            id: run_fastcheck_ss_hatest_x86
            run: |
              sh /usr/local/bin/entrypoint_ss_hatest.sh 
              if [ "$?" == "0" ]; then
                echo "result=0" >> "$ATOMGIT_OUTPUT"
              else
                echo "result=1" >> "$ATOMGIT_OUTPUT"
                exit 1
              fi

      ss_x86:
        name: ss_x86
        timeout-minutes: 60
        if: ${{ jobs.Detect_file_changes.outputs.need_run_ut == 'yes' }}
        continue-on-error: true
        runs-on: [self-hosted, server_x86, cpu=16]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/opengauss-ci/opengauss-ci-x86:ss-1.0.1
          options: --user root
        outputs:
          result: ${{ steps.run_fastcheck_ss_x86.outputs.result }}
        steps:
          - name: run_fastcheck_ss_x86
            id: run_fastcheck_ss_x86
            run: |
              sh /usr/local/bin/entrypoint_ss.sh 
              if [ "$?" == "0" ]; then
                echo "result=0" >> "$ATOMGIT_OUTPUT"
              else
                echo "result=1" >> "$ATOMGIT_OUTPUT"
                exit 1
              fi

  report_result:
    name: Report pipeline result
    select: selected_by_default
    jobs: 
      report_result:
        name: report_result
        runs-on: [self-hosted, server_x86, cpu=16]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/opengauss-ci/opengauss-ci-x86:script-1.0.1
          options: --user root
        timeout-minutes: 10
        continue-on-error: false
        outputs:
          labeled: ${{ steps.publish.outputs.labeled }}
        steps:
          - name: Show upstream status
            run: echo "pipeline.upstream_status=${{ pipeline.upstream_status }}"
          - name: Create label state
            id: state
            env:
              LABEL_JOB_TAG: result
              PR_LABEL_TOKEN: ${{ secrets.PR_LABEL_TOKEN }}
              NEED_RUN_UT: ${{ jobs.Detect_file_changes.outputs.need_run_ut }}
              LLT_A_ARM: ${{ jobs.llt_a_arm.outputs.result }}
              LLT_B_ARM: ${{ jobs.llt_b_arm.outputs.result }}
              LLT_C_ARM: ${{ jobs.llt_c_arm.outputs.result }}
              LLT_A_X86: ${{ jobs.llt_a_x86.outputs.result }}
              LLT_B_X86: ${{ jobs.llt_b_x86.outputs.result }}
              LLT_C_X86: ${{ jobs.llt_c_x86.outputs.result }}
              OM_INSTALL_X86: ${{ jobs.om_install_x86.outputs.result }}
              OM_UPGRADE_X86: ${{ jobs.om_upgrade_x86.outputs.result }}
              SS_HATEST_X86: ${{ jobs.ss_hatest_x86.outputs.result }}
              SS_X86: ${{ jobs.ss_x86.outputs.result }}
            run: |
              set -eu
              umask 077
              echo "LLT_A_ARM=${LLT_A_ARM}"
              echo "LLT_B_ARM=${LLT_B_ARM}"
              echo "LLT_C_ARM=${LLT_C_ARM}"
              echo "LLT_A_X86=${LLT_A_X86}"
              echo "LLT_B_X86=${LLT_B_X86}"
              echo "LLT_C_X86=${LLT_C_X86}"
              echo "OM_INSTALL_X86=${OM_INSTALL_X86}"
              echo "OM_UPGRADE_X86=${OM_UPGRADE_X86}"
              echo "SS_HATEST_X86=${SS_HATEST_X86}"

              pipeline_success=-1
              if [ "$LLT_A_ARM" = 0 ] && [ "$LLT_B_ARM" = 0 ] && \
                [ "$LLT_C_ARM" = 0 ] && [ "$LLT_A_X86" = 0 ] &&  \
                [ "$LLT_B_X86" = 0 ] && [ "$LLT_C_X86" = 0 ] &&  \
                [ "$OM_INSTALL_X86" = 0 ] && [ "$OM_UPGRADE_X86" = 0 ] && \
                [ "$SS_HATEST_X86" = 0 ] && [ "$SS_X86" = 0 ]; then
                echo "全部为 0"
                pipeline_success=0
              else
                echo "有非 0"
                pipeline_success=1
              fi

              if [ "${NEED_RUN_UT}" = 'no' ]; then
                echo "只有文档修改，跳过用例部分"
                pipeline_success=0
              fi

              repo="${GITCODE_REPO:-openGauss/openGauss-server}"
              server="${ATOMGIT_SERVER_URL:-}"
              if [ -z "${server}" ]; then
                server="${GITCODE_SERVER_URL:-}"
              fi
              if [ -z "${server}" ]; then
                server="https://gitcode.com"
              fi
              server="${server%/}"
              src="$(mktemp -d)"
              trap 'rm -rf "${src}"' EXIT
              timeout 300 git clone --depth=1 --branch master "${server}/${repo}.git" "${src}"
              label_script="${src}/.gitcode/scripts/gitcode_pr_labels.sh"

              if [ "${pipeline_success}" == 0 ]; then
                echo "-------- 打 success 标签 --------"
                bash "${label_script}" delete ci-pipeline-running
                bash "${label_script}" delete ci-pipeline-failed
                bash "${label_script}" add ci-pipeline-success
              else
                echo "-------- 打 failed 标签 ---------"
                bash "${label_script}" delete ci-pipeline-running
                bash "${label_script}" delete ci-pipeline-success
                bash "${label_script}" add ci-pipeline-failed
                exit 1
              fi