name: openGauss_server_PR

on:
  push:
    branches:
      - master
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - master
      - '**'
  pull_request_comment:
    types:
      - created
    branches:
      - master
      - '**'
    comments:
      - '^\s*/retest\s*$'
  workflow_dispatch:

permissions:
  repository: read
  pr: write
  note: write

env:
  GITCODE_REPO: opengauss/openGauss-server
  # 评论事件不在这里取号。issue.number 可能是评论编号，base_ref 也可能不是 PR 目标分支。
  GITCODE_EVENT_NAME: ${{ atomgit.event_name }}
  GITCODE_RUN_ID: ${{ atomgit.workflow_run_id }}
  GITCODE_PR_IID: ${{ (atomgit.event_name != 'pull_request_comment' && atomgit.event_name != 'pr_comment') && (atomgit.event.pull_request.number || atomgit.event.pull_request.iid || atomgit.event.merge_request.iid || atomgit.event.merge_request.number) || '' }}
  GITCODE_TARGET_BRANCH: ${{ (atomgit.event_name != 'pull_request_comment' && atomgit.event_name != 'pr_comment') && (atomgit.base_ref || atomgit.event.pull_request.base.ref || atomgit.event.pull_request.target_branch || atomgit.event.merge_request.target_branch) || '' }}

jobs:
  prepare:
    name: Mark running
    # 只有这一处在流水线开始时写标签。测试不依赖下面的 arm 补跑，arm 被跳过也不会取消测试。
    runs-on: [self-hosted, server_x86]
    timeout-minutes: 10
    # 打标签失败不把整条流水线标红。结果写入本任务的临时文件，再由成功的步骤公布。
    continue-on-error: true
    outputs:
      proceed: ${{ steps.publish.outputs.proceed }}
      labeled: ${{ steps.publish.outputs.labeled }}
      run_epoch: ${{ steps.state.outputs.run_epoch }}
    steps:
      - name: Create label state
        id: state
        run: |
          set -eu
          umask 077
          state="$(mktemp)"
          nonce="$(od -An -N16 -tx1 /dev/urandom 2>/dev/null | tr -d ' \n' || true)"
          if [ -z "${nonce}" ]; then
            nonce="$$${RANDOM}${RANDOM}"
          fi
          printf '%s\n' "nonce=${nonce}" "phase=init" > "${state}"
          chmod 600 "${state}"
          # 平台没有给出数字运行号时，本流水线只生成一次时间标记，后面的写标签都用它。
          run_epoch=""
          case "${GITCODE_RUN_ID:-}" in
            ''|*[!0-9]*)
              run_epoch="$(date +%s%3N 2>/dev/null || true)"
              case "${run_epoch}" in
                ''|*[!0-9]*) run_epoch="$(date +%s 2>/dev/null || true)" ;;
              esac
              case "${run_epoch}" in
                ''|*[!0-9]*) run_epoch="" ;;
              esac
              ;;
          esac
          out="${ATOMGIT_OUTPUT:-${GITHUB_OUTPUT:-}}"
          if [ -n "${out}" ]; then
            printf '%s\n' "path=${state}" "nonce=${nonce}" "run_epoch=${run_epoch}" >> "${out}"
          fi
      - name: Mark PR as running
        id: mark
        continue-on-error: true
        if: ${{ atomgit.event_name == 'pull_request_comment' || atomgit.event_name == 'pr_comment' || atomgit.event.pull_request.number || atomgit.event.pull_request.iid || atomgit.event.merge_request.iid || atomgit.event.merge_request.number }}
        env:
          PR_LABEL_TOKEN: ${{ secrets.PR_LABEL_TOKEN }}
          LABEL_STATE_PATH: ${{ steps.state.outputs.path }}
          LABEL_STATE_NONCE: ${{ steps.state.outputs.nonce }}
          GITCODE_RUN_EPOCH: ${{ steps.state.outputs.run_epoch }}
        run: |
          set -eu
          state="${LABEL_STATE_PATH:-}"
          nonce="${LABEL_STATE_NONCE:-}"
          if [ -z "${state}" ] || [ -z "${nonce}" ] || [ ! -f "${state}" ]; then
            echo "Label state file is missing." >&2
            exit 1
          fi
          if ! grep -Fqx -- "nonce=${nonce}" "${state}"; then
            echo "Label state file does not match this job." >&2
            exit 1
          fi
          printf '%s\n' "phase=started" >> "${state}"
          record() {
            printf '%s\n' "$1" >> "${state}"
          }
          repo="${GITCODE_REPO:-opengauss/openGauss-server}"
          case "${repo}" in
            */*) ;;
            *) echo "Invalid repository: ${repo}" >&2; record "proceed=no"; exit 1 ;;
          esac
          server="${ATOMGIT_SERVER_URL:-}"
          if [ -z "${server}" ]; then
            server="${GITCODE_SERVER_URL:-}"
          fi
          if [ -z "${server}" ]; then
            server="https://gitcode.com"
          fi
          server="${server%/}"
          dir="$(mktemp -d)"
          trap 'rm -rf "${dir}"' EXIT
          git -C "${dir}" init -q
          git -C "${dir}" remote add origin "${server}/${repo}.git"
          timeout 60 git -C "${dir}" fetch --depth=1 --force origin refs/heads/master
          git -C "${dir}" show "FETCH_HEAD:.gitcode/scripts/gitcode_pr_labels.sh" > "${dir}/gitcode_pr_labels.sh"
          git -C "${dir}" show "FETCH_HEAD:.gitcode/scripts/resolve_gitcode_env.sh" > "${dir}/resolve_gitcode_env.sh"
          set +e
          RESOLVE_SCRIPT="${dir}/resolve_gitcode_env.sh" bash "${dir}/gitcode_pr_labels.sh" running
          rc=$?
          set -e
          if [ "${rc}" -eq 3 ]; then
            record "proceed=no"
            record "labeled=no"
            exit 1
          fi
          record "proceed=yes"
          if [ "${rc}" -eq 0 ]; then
            record "labeled=yes"
          else
            record "labeled=no"
          fi
          exit "${rc}"
      - name: Publish label result
        id: publish
        if: always()
        env:
          LABEL_STATE_PATH: ${{ steps.state.outputs.path }}
          LABEL_STATE_NONCE: ${{ steps.state.outputs.nonce }}
        run: |
          set -eu
          out="${ATOMGIT_OUTPUT:-${GITHUB_OUTPUT:-}}"
          state="${LABEL_STATE_PATH:-}"
          nonce="${LABEL_STATE_NONCE:-}"
          record() {
            if [ -n "${out}" ]; then
              printf '%s\n' "$1" >> "${out}"
            fi
          }
          proceed=""
          labeled=""
          trusted=0
          if [ -n "${state}" ] && [ -n "${nonce}" ] && [ -f "${state}" ] && grep -Fqx -- "nonce=${nonce}" "${state}"; then
            trusted=1
          fi
          if [ "${trusted}" -eq 1 ]; then
            phase="$(grep '^phase=' "${state}" | tail -n 1 | cut -d= -f2- || true)"
            proceed="$(grep '^proceed=' "${state}" | tail -n 1 | cut -d= -f2- || true)"
            labeled="$(grep '^labeled=' "${state}" | tail -n 1 | cut -d= -f2- || true)"
            if [ "${phase}" = "init" ] && [ -z "${proceed}" ] && [ -z "${labeled}" ]; then
              proceed=yes
              labeled=yes
            else
              if [ -z "${proceed}" ]; then
                proceed=yes
              fi
              if [ -z "${labeled}" ]; then
                labeled=no
              fi
            fi
          else
            proceed=yes
            labeled=no
          fi
          if [ -n "${state}" ]; then
            rm -f "${state}"
          fi
          record "proceed=${proceed}"
          record "labeled=${labeled}"

  prepare_arm:
    name: Mark running on arm
    # x86 没写成时再写一次。没有任务依赖它，所以这里被跳过不会取消测试。
    # 结果任务也不依赖它。晚到时只补 running，不能把已经写上的成功或失败盖掉。
    needs: prepare
    # x86 超时、失败，或虽然 job 显示成功但标签没写上时，才由 arm 写。
    if: ${{ !cancelled() && needs.prepare.outputs.proceed != 'no' && (needs.prepare.result != 'success' || needs.prepare.outputs.labeled == 'no') }}
    runs-on: [self-hosted, server_arm]
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Mark PR as running
        if: ${{ atomgit.event_name == 'pull_request_comment' || atomgit.event_name == 'pr_comment' || atomgit.event.pull_request.number || atomgit.event.pull_request.iid || atomgit.event.merge_request.iid || atomgit.event.merge_request.number }}
        env:
          PR_LABEL_TOKEN: ${{ secrets.PR_LABEL_TOKEN }}
          GITCODE_RUN_EPOCH: ${{ needs.prepare.outputs.run_epoch }}
          GITCODE_KEEP_TERMINAL_RESULT: "yes"
        run: |
          set -eu
          repo="${GITCODE_REPO:-opengauss/openGauss-server}"
          case "${repo}" in
            */*) ;;
            *) echo "Invalid repository: ${repo}" >&2; exit 1 ;;
          esac
          server="${ATOMGIT_SERVER_URL:-}"
          if [ -z "${server}" ]; then
            server="${GITCODE_SERVER_URL:-}"
          fi
          if [ -z "${server}" ]; then
            server="https://gitcode.com"
          fi
          server="${server%/}"
          dir="$(mktemp -d)"
          trap 'rm -rf "${dir}"' EXIT
          git -C "${dir}" init -q
          git -C "${dir}" remote add origin "${server}/${repo}.git"
          timeout 60 git -C "${dir}" fetch --depth=1 --force origin refs/heads/master
          git -C "${dir}" show "FETCH_HEAD:.gitcode/scripts/gitcode_pr_labels.sh" > "${dir}/gitcode_pr_labels.sh"
          git -C "${dir}" show "FETCH_HEAD:.gitcode/scripts/resolve_gitcode_env.sh" > "${dir}/resolve_gitcode_env.sh"
          RESOLVE_SCRIPT="${dir}/resolve_gitcode_env.sh" bash "${dir}/gitcode_pr_labels.sh" running

  fail_closed:
    name: Fail when tests did not run
    needs: prepare
    # 每次都跑，并且不依赖测试任务。测试有排队时这里成功。
    # 身份没确认或打标签被取消时这里失败，且没有 continue-on-error。
    # 失败任务的输出可能被丢掉，所以时间标记不从这里往外传。
    if: ${{ always() && !cancelled() }}
    runs-on: [self-hosted, server_x86]
    timeout-minutes: 5
    steps:
      - name: Check whether tests ran
        env:
          GITCODE_PREPARE_PROCEED: ${{ needs.prepare.outputs.proceed }}
          GITCODE_PREPARE_RESULT: ${{ needs.prepare.result }}
        run: |
          set -eu
          if [ "${GITCODE_PREPARE_PROCEED:-}" = "no" ] || [ "${GITCODE_PREPARE_RESULT:-}" = "cancelled" ] || [ "${GITCODE_PREPARE_RESULT:-}" = "skipped" ]; then
            echo "Tests did not run, so this pipeline must not be reported as success." >&2
            exit 1
          fi
          echo "Tests were allowed to run."

  report_skipped:
    name: Report skipped tests as failed
    # 测试任务被跳过时不能作为依赖，否则失败标签写不出来。
    # 时间标记从 prepare 取。它在流水线开始时生成；fail_closed 会故意失败，输出可能丢失。
    needs: [prepare, fail_closed]
    if: ${{ always() && !cancelled() && (needs.fail_closed.result == 'failure' || needs.fail_closed.result == 'failed') }}
    runs-on: [self-hosted, server_x86]
    timeout-minutes: 10
    continue-on-error: true
    outputs:
      labeled: ${{ steps.publish.outputs.labeled }}
    steps:
      - name: Create label state
        id: state
        run: |
          set -eu
          umask 077
          state="$(mktemp)"
          nonce="$(od -An -N16 -tx1 /dev/urandom 2>/dev/null | tr -d ' \n' || true)"
          if [ -z "${nonce}" ]; then
            nonce="$$${RANDOM}${RANDOM}"
          fi
          printf '%s\n' "nonce=${nonce}" "phase=init" > "${state}"
          chmod 600 "${state}"
          out="${ATOMGIT_OUTPUT:-${GITHUB_OUTPUT:-}}"
          if [ -n "${out}" ]; then
            printf '%s\n' "path=${state}" "nonce=${nonce}" >> "${out}"
          fi
      - name: Mark PR as failed
        id: mark
        continue-on-error: true
        if: ${{ atomgit.event_name == 'pull_request_comment' || atomgit.event_name == 'pr_comment' || atomgit.event.pull_request.number || atomgit.event.pull_request.iid || atomgit.event.merge_request.iid || atomgit.event.merge_request.number }}
        env:
          PR_LABEL_TOKEN: ${{ secrets.PR_LABEL_TOKEN }}
          PIPELINE_UPSTREAM_STATUS: FAILED
          GITCODE_TESTS_RAN: no
          GITCODE_RUN_EPOCH: ${{ needs.prepare.outputs.run_epoch }}
          LABEL_STATE_PATH: ${{ steps.state.outputs.path }}
          LABEL_STATE_NONCE: ${{ steps.state.outputs.nonce }}
        run: |
          set -eu
          state="${LABEL_STATE_PATH:-}"
          nonce="${LABEL_STATE_NONCE:-}"
          if [ -z "${state}" ] || [ -z "${nonce}" ] || [ ! -f "${state}" ]; then
            echo "Label state file is missing." >&2
            exit 1
          fi
          if ! grep -Fqx -- "nonce=${nonce}" "${state}"; then
            echo "Label state file does not match this job." >&2
            exit 1
          fi
          printf '%s\n' "phase=started" >> "${state}"
          record() {
            printf '%s\n' "$1" >> "${state}"
          }
          repo="${GITCODE_REPO:-opengauss/openGauss-server}"
          case "${repo}" in
            */*) ;;
            *) echo "Invalid repository: ${repo}" >&2; record "labeled=no"; exit 1 ;;
          esac
          server="${ATOMGIT_SERVER_URL:-}"
          if [ -z "${server}" ]; then
            server="${GITCODE_SERVER_URL:-}"
          fi
          if [ -z "${server}" ]; then
            server="https://gitcode.com"
          fi
          server="${server%/}"
          dir="$(mktemp -d)"
          trap 'rm -rf "${dir}"' EXIT
          git -C "${dir}" init -q
          git -C "${dir}" remote add origin "${server}/${repo}.git"
          timeout 60 git -C "${dir}" fetch --depth=1 --force origin refs/heads/master
          git -C "${dir}" show "FETCH_HEAD:.gitcode/scripts/gitcode_pr_labels.sh" > "${dir}/gitcode_pr_labels.sh"
          git -C "${dir}" show "FETCH_HEAD:.gitcode/scripts/resolve_gitcode_env.sh" > "${dir}/resolve_gitcode_env.sh"
          set +e
          RESOLVE_SCRIPT="${dir}/resolve_gitcode_env.sh" bash "${dir}/gitcode_pr_labels.sh" result
          rc=$?
          set -e
          if [ "${rc}" -eq 0 ]; then
            record "labeled=yes"
          else
            record "labeled=no"
          fi
          exit "${rc}"
      - name: Publish label result
        id: publish
        if: always()
        env:
          LABEL_STATE_PATH: ${{ steps.state.outputs.path }}
          LABEL_STATE_NONCE: ${{ steps.state.outputs.nonce }}
        run: |
          set -eu
          out="${ATOMGIT_OUTPUT:-${GITHUB_OUTPUT:-}}"
          state="${LABEL_STATE_PATH:-}"
          nonce="${LABEL_STATE_NONCE:-}"
          record() {
            if [ -n "${out}" ]; then
              printf '%s\n' "$1" >> "${out}"
            fi
          }
          labeled=""
          trusted=0
          if [ -n "${state}" ] && [ -n "${nonce}" ] && [ -f "${state}" ] && grep -Fqx -- "nonce=${nonce}" "${state}"; then
            trusted=1
          fi
          if [ "${trusted}" -eq 1 ]; then
            phase="$(grep '^phase=' "${state}" | tail -n 1 | cut -d= -f2- || true)"
            labeled="$(grep '^labeled=' "${state}" | tail -n 1 | cut -d= -f2- || true)"
            if [ "${phase}" = "init" ] && [ -z "${labeled}" ]; then
              labeled=yes
            elif [ -z "${labeled}" ]; then
              labeled=no
            fi
          else
            labeled=no
          fi
          if [ -n "${state}" ]; then
            rm -f "${state}"
          fi
          record "labeled=${labeled}"

  report_skipped_arm:
    name: Report skipped tests as failed on arm
    needs: [report_skipped, fail_closed, prepare]
    if: ${{ always() && !cancelled() && (needs.fail_closed.result == 'failure' || needs.fail_closed.result == 'failed') && needs.report_skipped.outputs.labeled != 'yes' }}
    runs-on: [self-hosted, server_arm]
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Mark PR as failed
        if: ${{ atomgit.event_name == 'pull_request_comment' || atomgit.event_name == 'pr_comment' || atomgit.event.pull_request.number || atomgit.event.pull_request.iid || atomgit.event.merge_request.iid || atomgit.event.merge_request.number }}
        env:
          PR_LABEL_TOKEN: ${{ secrets.PR_LABEL_TOKEN }}
          PIPELINE_UPSTREAM_STATUS: FAILED
          GITCODE_TESTS_RAN: no
          GITCODE_RUN_EPOCH: ${{ needs.prepare.outputs.run_epoch }}
        run: |
          set -eu
          repo="${GITCODE_REPO:-opengauss/openGauss-server}"
          case "${repo}" in
            */*) ;;
            *) echo "Invalid repository: ${repo}" >&2; exit 1 ;;
          esac
          server="${ATOMGIT_SERVER_URL:-}"
          if [ -z "${server}" ]; then
            server="${GITCODE_SERVER_URL:-}"
          fi
          if [ -z "${server}" ]; then
            server="https://gitcode.com"
          fi
          server="${server%/}"
          dir="$(mktemp -d)"
          trap 'rm -rf "${dir}"' EXIT
          git -C "${dir}" init -q
          git -C "${dir}" remote add origin "${server}/${repo}.git"
          timeout 60 git -C "${dir}" fetch --depth=1 --force origin refs/heads/master
          git -C "${dir}" show "FETCH_HEAD:.gitcode/scripts/gitcode_pr_labels.sh" > "${dir}/gitcode_pr_labels.sh"
          git -C "${dir}" show "FETCH_HEAD:.gitcode/scripts/resolve_gitcode_env.sh" > "${dir}/resolve_gitcode_env.sh"
          RESOLVE_SCRIPT="${dir}/resolve_gitcode_env.sh" bash "${dir}/gitcode_pr_labels.sh" result

  openGauss_server_x86:
    name: ${{ matrix.name }}
    needs: [prepare]
    # 只等 x86 打标签结束，不再等 arm。标签脚本失败时 job 是 failure，测试仍然启动。
    # 评论身份无法确认时 proceed=no，测试不排队。x86 打标签超时取消时也不排队。
    if: ${{ !cancelled() && needs.prepare.outputs.proceed != 'no' && (needs.prepare.result == 'success' || needs.prepare.result == 'failure') }}
    # 7 台节点都打上 server_x86。调度器把下面 7 个任务分给空闲节点，一台一个，配对不固定。
    runs-on: [self-hosted, server_x86]
    # 同一台机器用 flock 串行。10 个任务若排到同一台，总时限要盖住整队等待和各自 120 分钟测试。
    timeout-minutes: 1680
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        include:
          - name: x86-LLT-A
            script: main_llt_A.sh
          - name: x86-LLT-B
            script: main_llt_B.sh
          - name: x86-LLT-C
            script: main_llt_C.sh
          - name: x86-OM-Install
            script: main_om_install.sh
          - name: x86-OM-Upgrade
            script: main_om_upgrade.sh
          - name: x86-SS-Hatest
            script: main_ss_hatest.sh
          - name: x86-SS
            script: main_ss.sh
    steps:
      - name: Manual checkout source code
        env:
          WORKSPACE_ROOT: /usr1/gauss_jenkins/jenkins/workspace1/
          PR_LABEL_TOKEN: ${{ secrets.PR_LABEL_TOKEN }}
        run: |
          set -eu
          # Host scripts always come from this repository, not a fork named by the event.
          repo="${GITCODE_REPO:-opengauss/openGauss-server}"
          case "${repo}" in
            */*) ;;
            *) echo "Invalid repository: ${repo}" >&2; exit 1 ;;
          esac
          server="${ATOMGIT_SERVER_URL:-}"
          if [ -z "${server}" ]; then
            server="${GITCODE_SERVER_URL:-}"
          fi
          if [ -z "${server}" ]; then
            server="https://gitcode.com"
          fi
          server="${server%/}"
          dir=""
          token_file=""
          cleanup() {
            if [ -n "${dir}" ]; then
              rm -rf "${dir}"
            fi
            if [ -n "${token_file}" ]; then
              rm -f "${token_file}"
            fi
          }
          trap cleanup EXIT
          # Keep the label token out of this shell for the rest of the job.
          # Checkout reads it from the file, then deletes the file.
          if [ -n "${PR_LABEL_TOKEN:-}" ]; then
            token_file="$(mktemp)"
            chmod 600 "${token_file}"
            printf '%s\n' "${PR_LABEL_TOKEN}" > "${token_file}"
            export GITCODE_TOKEN_FILE="${token_file}"
          fi
          unset PR_LABEL_TOKEN || true
          unset ATOMGIT_TOKEN || true
          dir="$(mktemp -d)"
          git -C "${dir}" init -q
          git -C "${dir}" remote add origin "${server}/${repo}.git"
          timeout 300 git -C "${dir}" fetch --depth=1 --force origin refs/heads/master
          git -C "${dir}" show "FETCH_HEAD:.gitcode/scripts/ci_job.sh" > "${dir}/ci_job.sh"
          CI_MATRIX_SCRIPT="${{ matrix.script }}" bash "${dir}/ci_job.sh"

  openGauss_server_arm:
    name: ${{ matrix.name }}
    needs: [prepare]
    # 只等 x86 打标签结束，不再等 arm。标签脚本失败时 job 是 failure，测试仍然启动。
    # 评论身份无法确认时 proceed=no，测试不排队。x86 打标签超时取消时也不排队。
    if: ${{ !cancelled() && needs.prepare.outputs.proceed != 'no' && (needs.prepare.result == 'success' || needs.prepare.result == 'failure') }}
    # 3 台节点都打上 server_arm。调度器把下面 3 个任务分给空闲节点，一台一个，配对不固定。
    runs-on: [self-hosted, server_arm]
    # 同一台机器用 flock 串行。10 个任务若排到同一台，总时限要盖住整队等待和各自 120 分钟测试。
    timeout-minutes: 1680
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - name: arm-LLT-A
            script: main_llt_A.sh
          - name: arm-LLT-B
            script: main_llt_B.sh
          - name: arm-LLT-C
            script: main_llt_C.sh
    steps:
      - name: Manual checkout source code
        env:
          WORKSPACE_ROOT: /usr1/gauss_jenkins/jenkins/workspace1/
          PR_LABEL_TOKEN: ${{ secrets.PR_LABEL_TOKEN }}
        run: |
          set -eu
          # Host scripts always come from this repository, not a fork named by the event.
          repo="${GITCODE_REPO:-opengauss/openGauss-server}"
          case "${repo}" in
            */*) ;;
            *) echo "Invalid repository: ${repo}" >&2; exit 1 ;;
          esac
          server="${ATOMGIT_SERVER_URL:-}"
          if [ -z "${server}" ]; then
            server="${GITCODE_SERVER_URL:-}"
          fi
          if [ -z "${server}" ]; then
            server="https://gitcode.com"
          fi
          server="${server%/}"
          dir=""
          token_file=""
          cleanup() {
            if [ -n "${dir}" ]; then
              rm -rf "${dir}"
            fi
            if [ -n "${token_file}" ]; then
              rm -f "${token_file}"
            fi
          }
          trap cleanup EXIT
          # Keep the label token out of this shell for the rest of the job.
          # Checkout reads it from the file, then deletes the file.
          if [ -n "${PR_LABEL_TOKEN:-}" ]; then
            token_file="$(mktemp)"
            chmod 600 "${token_file}"
            printf '%s\n' "${PR_LABEL_TOKEN}" > "${token_file}"
            export GITCODE_TOKEN_FILE="${token_file}"
          fi
          unset PR_LABEL_TOKEN || true
          unset ATOMGIT_TOKEN || true
          dir="$(mktemp -d)"
          git -C "${dir}" init -q
          git -C "${dir}" remote add origin "${server}/${repo}.git"
          timeout 300 git -C "${dir}" fetch --depth=1 --force origin refs/heads/master
          git -C "${dir}" show "FETCH_HEAD:.gitcode/scripts/ci_job.sh" > "${dir}/ci_job.sh"
          CI_MATRIX_SCRIPT="${{ matrix.script }}" bash "${dir}/ci_job.sh"

post:
  jobs:
    report_result:
      name: Report pipeline result
      # 测试真的会跑时才依赖它们，结果要等测试结束再写。
      # 测试被跳过时，失败标签由 report_skipped 写，这里不再跑，避免依赖被跳过的任务。
      needs: [prepare, openGauss_server_x86, openGauss_server_arm, fail_closed]
      if: ${{ always() && needs.fail_closed.result != 'failure' && needs.fail_closed.result != 'failed' }}
      runs-on: [self-hosted, server_x86]
      timeout-minutes: 10
      continue-on-error: true
      outputs:
        labeled: ${{ steps.publish.outputs.labeled }}
      steps:
        - name: Show upstream status
          run: echo "pipeline.upstream_status=${{ pipeline.upstream_status }}"
        - name: Create label state
          id: state
          run: |
            set -eu
            umask 077
            state="$(mktemp)"
            nonce="$(od -An -N16 -tx1 /dev/urandom 2>/dev/null | tr -d ' \n' || true)"
            if [ -z "${nonce}" ]; then
              nonce="$$${RANDOM}${RANDOM}"
            fi
            printf '%s\n' "nonce=${nonce}" "phase=init" > "${state}"
            chmod 600 "${state}"
            out="${ATOMGIT_OUTPUT:-${GITHUB_OUTPUT:-}}"
            if [ -n "${out}" ]; then
              printf '%s\n' "path=${state}" "nonce=${nonce}" >> "${out}"
            fi
        - name: Update pull request label
          id: mark
          continue-on-error: true
          if: ${{ atomgit.event_name == 'pull_request_comment' || atomgit.event_name == 'pr_comment' || atomgit.event.pull_request.number || atomgit.event.pull_request.iid || atomgit.event.merge_request.iid || atomgit.event.merge_request.number }}
          env:
            PR_LABEL_TOKEN: ${{ secrets.PR_LABEL_TOKEN }}
            PIPELINE_UPSTREAM_STATUS: ${{ pipeline.upstream_status }}
            GITCODE_PREPARE_PROCEED: ${{ needs.prepare.outputs.proceed }}
            GITCODE_PREPARE_RESULT: ${{ needs.prepare.result }}
            GITCODE_X86_RESULT: ${{ needs.openGauss_server_x86.result }}
            GITCODE_FAIL_CLOSED_RESULT: ${{ needs.fail_closed.result }}
            GITCODE_RUN_EPOCH: ${{ needs.prepare.outputs.run_epoch }}
            LABEL_STATE_PATH: ${{ steps.state.outputs.path }}
            LABEL_STATE_NONCE: ${{ steps.state.outputs.nonce }}
          run: |
            set -eu
            state="${LABEL_STATE_PATH:-}"
            nonce="${LABEL_STATE_NONCE:-}"
            if [ -z "${state}" ] || [ -z "${nonce}" ] || [ ! -f "${state}" ]; then
              echo "Label state file is missing." >&2
              exit 1
            fi
            if ! grep -Fqx -- "nonce=${nonce}" "${state}"; then
              echo "Label state file does not match this job." >&2
              exit 1
            fi
            printf '%s\n' "phase=started" >> "${state}"
            record() {
              printf '%s\n' "$1" >> "${state}"
            }
            repo="${GITCODE_REPO:-opengauss/openGauss-server}"
            case "${repo}" in
              */*) ;;
              *) echo "Invalid repository: ${repo}" >&2; record "labeled=no"; exit 1 ;;
            esac
            server="${ATOMGIT_SERVER_URL:-}"
            if [ -z "${server}" ]; then
              server="${GITCODE_SERVER_URL:-}"
            fi
            if [ -z "${server}" ]; then
              server="https://gitcode.com"
            fi
            server="${server%/}"
            dir="$(mktemp -d)"
            trap 'rm -rf "${dir}"' EXIT
            git -C "${dir}" init -q
            git -C "${dir}" remote add origin "${server}/${repo}.git"
            timeout 60 git -C "${dir}" fetch --depth=1 --force origin refs/heads/master
            git -C "${dir}" show "FETCH_HEAD:.gitcode/scripts/gitcode_pr_labels.sh" > "${dir}/gitcode_pr_labels.sh"
            git -C "${dir}" show "FETCH_HEAD:.gitcode/scripts/resolve_gitcode_env.sh" > "${dir}/resolve_gitcode_env.sh"
            set +e
            RESOLVE_SCRIPT="${dir}/resolve_gitcode_env.sh" bash "${dir}/gitcode_pr_labels.sh" result
            rc=$?
            set -e
            if [ "${rc}" -eq 0 ]; then
              record "labeled=yes"
            else
              record "labeled=no"
            fi
            exit "${rc}"
        - name: Publish label result
          id: publish
          if: always()
          env:
            LABEL_STATE_PATH: ${{ steps.state.outputs.path }}
            LABEL_STATE_NONCE: ${{ steps.state.outputs.nonce }}
          run: |
            set -eu
            out="${ATOMGIT_OUTPUT:-${GITHUB_OUTPUT:-}}"
            state="${LABEL_STATE_PATH:-}"
            nonce="${LABEL_STATE_NONCE:-}"
            record() {
              if [ -n "${out}" ]; then
                printf '%s\n' "$1" >> "${out}"
              fi
            }
            labeled=""
            trusted=0
            if [ -n "${state}" ] && [ -n "${nonce}" ] && [ -f "${state}" ] && grep -Fqx -- "nonce=${nonce}" "${state}"; then
              trusted=1
            fi
            if [ "${trusted}" -eq 1 ]; then
              phase="$(grep '^phase=' "${state}" | tail -n 1 | cut -d= -f2- || true)"
              labeled="$(grep '^labeled=' "${state}" | tail -n 1 | cut -d= -f2- || true)"
              if [ "${phase}" = "init" ] && [ -z "${labeled}" ]; then
                labeled=yes
              elif [ -z "${labeled}" ]; then
                labeled=no
              fi
            else
              labeled=no
            fi
            if [ -n "${state}" ]; then
              rm -f "${state}"
            fi
            record "labeled=${labeled}"
    report_result_arm:
      name: Report pipeline result on arm
      needs: [report_result, prepare, openGauss_server_x86, openGauss_server_arm, fail_closed]
      if: ${{ always() && !cancelled() && needs.fail_closed.result != 'failure' && needs.fail_closed.result != 'failed' && (needs.report_result.outputs.labeled == 'no' || needs.report_result.result == 'failure' || needs.report_result.result == 'cancelled') }}
      runs-on: [self-hosted, server_arm]
      timeout-minutes: 10
      continue-on-error: true
      steps:
        - name: Show upstream status
          run: echo "pipeline.upstream_status=${{ pipeline.upstream_status }}"
        - name: Update pull request label
          if: ${{ atomgit.event_name == 'pull_request_comment' || atomgit.event_name == 'pr_comment' || atomgit.event.pull_request.number || atomgit.event.pull_request.iid || atomgit.event.merge_request.iid || atomgit.event.merge_request.number }}
          env:
            PR_LABEL_TOKEN: ${{ secrets.PR_LABEL_TOKEN }}
            PIPELINE_UPSTREAM_STATUS: ${{ pipeline.upstream_status }}
            GITCODE_PREPARE_PROCEED: ${{ needs.prepare.outputs.proceed }}
            GITCODE_PREPARE_RESULT: ${{ needs.prepare.result }}
            GITCODE_X86_RESULT: ${{ needs.openGauss_server_x86.result }}
            GITCODE_FAIL_CLOSED_RESULT: ${{ needs.fail_closed.result }}
            GITCODE_RUN_EPOCH: ${{ needs.prepare.outputs.run_epoch }}
          run: |
            set -eu
            repo="${GITCODE_REPO:-opengauss/openGauss-server}"
            case "${repo}" in
              */*) ;;
              *) echo "Invalid repository: ${repo}" >&2; exit 1 ;;
            esac
            server="${ATOMGIT_SERVER_URL:-}"
            if [ -z "${server}" ]; then
              server="${GITCODE_SERVER_URL:-}"
            fi
            if [ -z "${server}" ]; then
              server="https://gitcode.com"
            fi
            server="${server%/}"
            dir="$(mktemp -d)"
            trap 'rm -rf "${dir}"' EXIT
            git -C "${dir}" init -q
            git -C "${dir}" remote add origin "${server}/${repo}.git"
            timeout 60 git -C "${dir}" fetch --depth=1 --force origin refs/heads/master
            git -C "${dir}" show "FETCH_HEAD:.gitcode/scripts/gitcode_pr_labels.sh" > "${dir}/gitcode_pr_labels.sh"
            git -C "${dir}" show "FETCH_HEAD:.gitcode/scripts/resolve_gitcode_env.sh" > "${dir}/resolve_gitcode_env.sh"
            RESOLVE_SCRIPT="${dir}/resolve_gitcode_env.sh" bash "${dir}/gitcode_pr_labels.sh" result